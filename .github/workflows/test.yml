name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  # Lets deploy.yml run this suite as a gate before deploying.
  workflow_call:

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter ./frontend lint

      - name: Run unit tests
        run: pnpm --filter ./frontend test:run

      - name: Type-check end-to-end specs
        run: pnpm exec tsc --noEmit

  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openats
          POSTGRES_PASSWORD: openats
          POSTGRES_DB: openats_test
        # 5433 to match backend-py/.env.test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend-py

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-py/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # backend-py/.env.test is committed on purpose - it holds no secrets,
      # only dummy values, so PRs from forks can run it.
      - name: Use the test env file
        run: cp .env.test .env

      - name: Apply migrations to the test database
        run: alembic upgrade head

      - name: Lint
        run: ruff check app

      - name: Type-check
        run: mypy app

      - name: Run unit and integration tests
        run: pytest tests/ -q
